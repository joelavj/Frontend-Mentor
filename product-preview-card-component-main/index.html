<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <title>Frontend Mentor | Product preview card component</title>
</head>

<body>
  <div class="card-product">
    <picture>
      <source media="(min-width: 600px)" srcset="./assets/images/image-product-desktop.jpg">
      <img src="./assets/images/image-product-mobile.jpg" alt="..." class="product-image">
    </picture>
    <div class="info-product">
      <span class="category-product">Perfume</span>
      <h1 class="name-product">Gabrielle Essence Eau De Parfum</h1>
      <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.</p>

      <div class="price-container">
        <span class="current-price">$149.99</span>
        <del class="original-price">$169.99</del>
      </div>
      <button class="add-to-cart">
        <img src="./assets/images/icon-cart.svg">
        <span>Add to Cart</span>
      </button>
    </div>
  </div>
</body>

</html>
